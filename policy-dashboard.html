<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Platform Regulation Intelligence Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e3e7ec;
    --border-strong: #d3d9e0;
    --ink: #1e2733;
    --ink-soft: #5a6573;
    --ink-faint: #8a94a1;
    --header: #1A1A1A;
    --header-soft: #2A2A2A;
    --accent: #D4A017;
    --accent-soft: #FEF6F0;
    --accent-border: #E8D1A8;
    --accent-hover: #F5EDDE;
    --active-bg: #e4f2ea; --active-ink: #236b46; --active-dot: #2f9e6b;
    --pending-bg: #fbf0da; --pending-ink: #8a6212; --pending-dot: #d99a2b;
    --minimal-bg: #eceff2; --minimal-ink: #56626f; --minimal-dot: #97a2ae;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(20,30,45,.04), 0 2px 8px rgba(20,30,45,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 1240px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  header.top {
    background: var(--header);
    color: #fff;
    padding: 18px 28px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 8px;
    background: linear-gradient(135deg, #D4A017, #E8B547);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; letter-spacing: .5px; color: #fff;
  }
  .brand h1 {
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 21px; margin: 0;
    font-weight: 700; letter-spacing: -.2px;
  }
  .brand .sub { font-size: 12px; color: #b7c2d0; margin-top: 1px; }
  .header-tag {
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: #b7c2d0; border: 1px solid #46586c; border-radius: 20px; padding: 4px 11px;
    white-space: nowrap;
  }

  /* Controls bar */
  .controls-bar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 16px 30px;
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .control-group label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .9px;
    color: var(--ink-faint);
    font-weight: 600;
  }
  .control-group select {
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    padding: 8px 12px;
    min-width: 200px;
    cursor: pointer;
  }
  .control-group select:hover {
    border-color: var(--accent);
  }
  .view-toggle {
    appearance: none; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
    color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-border);
    border-radius: 20px; padding: 8px 14px; white-space: nowrap;
    align-self: flex-end;
    margin-left: auto;
  }
  .view-toggle:hover { background: var(--accent-hover); }

  /* Badge legend */
  .legend {
    display: flex; align-items: center; flex-wrap: wrap; gap: 14px;
    font-size: 12px; color: var(--ink-soft); padding: 4px 10px 12px;
  }
  .legend .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend .legend-item b { color: var(--ink); }

  /* Matrix / overview view */
  .matrix-wrap { padding: 22px 30px; flex: 1; overflow: auto; }
  table.matrix { border-collapse: collapse; width: 100%; }
  table.matrix th, table.matrix td { border: 1px solid var(--border); padding: 0; }
  table.matrix thead th {
    background: var(--panel); font-size: 12px; font-weight: 700; color: var(--ink-soft);
    padding: 10px 8px; text-align: left; position: sticky; top: 0;
  }
  table.matrix thead th.jur-col { text-align: center; }
  table.matrix tbody th {
    background: var(--panel); font-size: 13.5px; font-weight: 600; text-align: left;
    padding: 10px 12px; white-space: nowrap;
  }
  .matrix-cell {
    width: 100%; appearance: none; cursor: pointer; background: #fff; border: none;
    padding: 10px 8px; display: flex; justify-content: center; transition: background .12s;
  }
  .matrix-cell:hover { background: var(--accent-soft); }

  /* Body layout */
  .body { display: flex; flex: 1; align-items: stretch; }

  /* Sidebar — hidden */
  aside.domains { display: none; }

  /* Status badge */
  .badge {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; letter-spacing: .3px;
    padding: 3px 9px 3px 8px; border-radius: 20px;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; }
  .badge.Active { background: var(--active-bg); color: var(--active-ink); }
  .badge.Active .dot { background: var(--active-dot); }
  .badge.Pending { background: var(--pending-bg); color: var(--pending-ink); }
  .badge.Pending .dot { background: var(--pending-dot); }
  .badge.Minimal { background: #eceff2; color: var(--minimal-ink); }
  .badge.Minimal .dot { background: var(--minimal-dot); }

  /* Main panel */
  main.panel { flex: 1; padding: 26px 30px; min-width: 0; }
  .crumb { font-size: 12.5px; color: var(--ink-faint); margin-bottom: 8px; letter-spacing: .2px; }
  .crumb b { color: var(--ink-soft); font-weight: 600; }
  .panel-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-bottom: 6px;
  }
  .panel-head h2 {
    font-family: "Fraunces", Georgia, serif; font-size: 25px; margin: 0;
    font-weight: 600; letter-spacing: -.3px;
  }
  .panel-meta { font-size: 13px; color: var(--ink-soft); margin: 4px 0 22px; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 20px; margin-bottom: 16px;
  }
  .card h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--accent); margin: 0 0 4px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .card h3 .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 5px; background: var(--accent-soft);
    color: var(--accent); font-size: 11px; font-weight: 700;
  }
  .card .card-body { color: var(--ink); font-size: 14.5px; }
  .card .card-body p { margin: 8px 0; }
  .card .card-body ul { margin: 8px 0; padding-left: 18px; }
  .card .card-body li { margin: 5px 0; }

  /* Timeline rows (Legislative Status / Key Regulatory Actions) */
  .timeline { display: flex; flex-direction: column; gap: 12px; }
  .tl-row { display: flex; gap: 14px; align-items: flex-start; }
  .tl-when {
    flex: 0 0 150px; font-size: 12px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: .3px; line-height: 1.4; padding-top: 1px;
  }
  .tl-text { flex: 1; line-height: 1.5; }
  @media (max-width: 640px) {
    .tl-row { flex-direction: column; gap: 3px; }
    .tl-when { flex: none; }
  }

  /* Stakeholder / implications bullet lists */
  .stake-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .stake-list li {
    position: relative; padding-left: 16px; margin: 0; line-height: 1.5;
  }
  .stake-list li::before {
    content: ""; position: absolute; left: 0; top: 8px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent-soft);
    border: 1.5px solid var(--accent);
  }

  .relevance-card { background: #FAF7F0; border-color: #EDD9C0; }
  .relevance-card h3 { color: #8B5A7D; }
  .relevance-card h3 .num { background: #F1E8F0; color: #8B5A7D; }

  .placeholder-note {
    display: flex; gap: 10px; align-items: flex-start;
    background: #fbf7ec; border: 1px solid #eedec0;
    border-radius: 9px; padding: 11px 14px; margin-bottom: 20px;
    font-size: 13px; color: #7d6420;
  }
  .placeholder-note .ic { font-size: 14px; line-height: 1.3; }
  .placeholder-note.sourced { background: #eaf2ee; border-color: #cfe3d8; color: #2c5c46; }

  .sources-card { background: #fafbfc; }
  .sources-card h3 { color: var(--ink-soft); }
  .sources-card ul { margin: 4px 0; padding-left: 18px; }
  .sources-card li { margin: 4px 0; font-size: 13.5px; }
  .sources-card a { color: var(--accent); text-decoration: none; }
  .sources-card a:hover { text-decoration: underline; }
  .research-note { font-size: 13px; color: var(--ink-soft); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border-strong); }
  .empty-section { color: var(--ink-faint); font-style: italic; margin: 0; }

  .empty {
    text-align: center; color: var(--ink-faint); padding: 80px 20px;
  }
  .empty .big { font-family: "Fraunces", Georgia, serif; font-size: 19px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 600; }

  /* Footer */
  footer.disc {
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 14px 30px; font-size: 12px; color: var(--ink-faint);
    text-align: center; letter-spacing: .1px;
  }
  footer.disc .sourcing-line {
    margin-top: 6px; font-size: 11.5px; color: var(--ink-faint);
    max-width: 780px; margin-left: auto; margin-right: auto; line-height: 1.5;
  }

  @media (max-width: 900px) {
    .controls-bar { flex-direction: column; align-items: flex-start; gap: 12px; }
    .control-group { flex-direction: row; align-items: center; gap: 8px; }
    .control-group select { min-width: 160px; }
  }
</style>
</head>

function Badge({ status }) {
  return (
    <span className={"badge " + status}>
      <span className="dot"></span>{status}
    </span>
  );
}

function SectionBody({ section }) {
  if (section.timeline) {
    if (section.timeline.length === 0) {
      return <p className="empty-section">No activity found in approved sources for this section.</p>;
    }
    return (
      <div className="timeline">
        {section.timeline.map((t, i) => (
          <div className="tl-row" key={i}>
            <div className="tl-when">{t.when}</div>
            <div className="tl-text">{t.text}</div>
          </div>
        ))}
      </div>
    );
  }
  if (section.bullets) {
    if (section.bullets.length === 0) {
      return <p className="empty-section">Nothing to report in approved sources for this section.</p>;
    }
    return (
      <ul className="stake-list">
        {section.bullets.map((b, i) => (
          <li key={i}>{typeof b === "string" ? b : (<><b>{b.who}:</b> {b.text}</>)}</li>
        ))}
      </ul>
    );
  }
  return section.paragraphs.map((p, pi) => <p key={pi}>{p}</p>);
}

// ----- Deep-linking: jurisdiction + domain + profile + view encoded in the URL hash -----
function parseHash() {
  if (typeof window === "undefined") return {};
  const params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  return {
    jur: params.get("jur"),
    dom: params.get("dom"),
    profile: params.get("profile"),
    view: params.get("view"),
  };
}

function App() {
  const initial = parseHash();
  const [jur, setJur] = useState(
    JURISDICTIONS.includes(initial.jur) ? initial.jur : "California"
  );
  const [dom, setDom] = useState(
    DOMAINS.some(d => d.key === initial.dom) ? initial.dom : null
  );
  const [profile, setProfile] = useState(
    PROFILES.some(p => p.key === initial.profile) ? initial.profile : "global_policy"
  );
  const [view, setView] = useState(initial.view === "matrix" ? "matrix" : "detail");

  useEffect(() => {
    const params = new URLSearchParams();
    params.set("view", view);
    if (jur) params.set("jur", jur);
    if (dom) params.set("dom", dom);
    if (profile) params.set("profile", profile);
    window.location.hash = params.toString();
  }, [jur, dom, profile, view]);

  const activeDomain = DOMAINS.find(d => d.key === dom);
  const status = dom ? STATUS[jur][dom] : null;
  const briefingKey = jur + "|" + dom;
  const briefing = dom ? BRIEFINGS[briefingKey] : null;
  const relevance = (briefing && profile) ? RELEVANCE[briefingKey]?.[profile] : null;

  function jumpTo(j, dkey) {
    setJur(j);
    setDom(dkey);
    setView("detail");
  }

  return (
    <div className="app">
      <header className="top">
        <div className="brand">
          <div className="mark">PS</div>
          <div>
            <h1>{TOOL_NAME}</h1>
            <div className="sub">{TOOL_TAGLINE}</div>
          </div>
        </div>
        <div className="header-tag">Portfolio Prototype</div>
      </header>

      <div className="controls-bar">
        <div className="control-group">
          <label htmlFor="jur-select">Jurisdiction</label>
          <select id="jur-select" value={jur} onChange={e => setJur(e.target.value)}>
            {JURISDICTIONS.map(j => <option key={j} value={j}>{j}</option>)}
          </select>
        </div>

        <div className="control-group">
          <label htmlFor="dom-select">Policy Domain</label>
          <select id="dom-select" value={dom || ""} onChange={e => setDom(e.target.value || null)}>
            <option value="">— Select a domain —</option>
            {DOMAINS.map(d => <option key={d.key} value={d.key}>{d.name}</option>)}
          </select>
        </div>

        <div className="control-group">
          <label htmlFor="profile-select">View As</label>
          <select id="profile-select" value={profile} onChange={e => setProfile(e.target.value)}>
            {PROFILES.map(p => <option key={p.key} value={p.key}>{p.label}</option>)}
          </select>
        </div>

        <button className="view-toggle" onClick={() => setView(view === "detail" ? "matrix" : "detail")}>
          {view === "detail" ? "▦ Matrix view" : "← Briefing view"}
        </button>
      </div>

      <div className="legend">
        {STATUS_DEFS.map(s => (
          <div className="legend-item" key={s.key} title={s.desc}>
            <Badge status={s.key} /> <span>{s.desc}</span>
          </div>
        ))}
      </div>

      {view === "matrix" ? (
        <div className="matrix-wrap">
          <table className="matrix">
            <thead>
              <tr>
                <th></th>
                {JURISDICTIONS.map(j => <th className="jur-col" key={j}>{j}</th>)}
              </tr>
            </thead>
            <tbody>
              {DOMAINS.map(d => (
                <tr key={d.key}>
                  <th>{d.name}</th>
                  {JURISDICTIONS.map(j => (
                    <td key={j}>
                      <button
                        className="matrix-cell"
                        title={j + " · " + d.name + " · " + STATUS[j][d.key]}
                        onClick={() => jumpTo(j, d.key)}
                      >
                        <Badge status={STATUS[j][d.key]} />
                      </button>
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      ) : (
        <main className="panel" style={{ flex: 1 }}>
          {!dom && (
            <div className="empty">
              <div className="big">Select a policy domain</div>
              <div>Choose a jurisdiction and domain from the dropdowns above to view its briefing.</div>
            </div>
          )}

          {dom && (
            <div>
              <div className="crumb"><b>{jur}</b> &nbsp;›&nbsp; {activeDomain.name}</div>
              <div className="panel-head">
                <h2>{activeDomain.name}</h2>
                <Badge status={status} />
              </div>
              <div className="panel-meta">{activeDomain.blurb} · Jurisdiction: {jur}</div>

              {briefing ? (
                <div className="placeholder-note sourced">
                  <span className="ic">✓</span>
                  <span>
                    <b>Last reviewed: {briefing.asOf}.</b> Drawn only from named government portals, wire-service
                    journalism, policy research organizations, and platform transparency reports (see footer for the
                    full list). Legislative and regulatory activity moves quickly — recommend a refresh check before
                    relying on time-sensitive details.
                  </span>
                </div>
              ) : (
                <div className="placeholder-note">
                  <span className="ic">◔</span>
                  <span>
                    <b>Not yet researched.</b> Sections below show the fixed briefing structure with placeholder text
                    until this combination is researched from approved sources.
                  </span>
                </div>
              )}

              {SECTIONS.map((title, i) => (
                <div className="card" key={title}>
                  <h3><span className="num">{i + 1}</span>{title}</h3>
                  <div className="card-body">
                    {briefing
                      ? <SectionBody section={briefing.sections[i]} />
                      : (
                        <p>
                          Placeholder for <b>{title.toLowerCase()}</b> covering {activeDomain.name.toLowerCase()} in {jur}.
                          This section will be generated from approved government, journalism, policy, and platform-transparency sources with primary citations.
                        </p>
                      )}
                  </div>
                </div>
              ))}

              {relevance && (
                <div className="card relevance-card">
                  <h3><span className="num">5</span>Relevance to Your Team</h3>
                  <div className="card-body">
                    <ul className="stake-list">
                      {relevance.map((r, i) => <li key={i}>{r}</li>)}
                    </ul>
                    <p className="research-note">
                      This section changes based on the team profile selected above. Sections 1–4 never do —
                      they describe the same facts regardless of who's asking.
                    </p>
                  </div>
                </div>
              )}
              {profile && briefing && !relevance && (
                <div className="card relevance-card">
                  <h3><span className="num">5</span>Relevance to Your Team</h3>
                  <div className="card-body">
                    <p>Not yet mapped for this profile and combination.</p>
                  </div>
                </div>
              )}

              {briefing && (
                <div className="card sources-card">
                  <h3><span className="num">↗</span>Sources</h3>
                  <div className="card-body">
                    <ul>
                      {briefing.sources.map((s, si) => (
                        <li key={si}><a href={s.url} target="_blank" rel="noreferrer">{s.label}</a></li>
                      ))}
                    </ul>
                    {briefing.researchNote && (
                      <p className="research-note"><b>Research note:</b> {briefing.researchNote}</p>
                    )}
                  </div>
                </div>
              )}
            </div>
          )}
        </main>
      )}

      <footer className="disc">
        <div>This tool is a portfolio prototype for informational purposes only and does not constitute legal or regulatory advice.</div>
        <div className="sourcing-line">
          Every briefing is drawn only from named government portals, wire-service journalism (Reuters, AP, Politico Tech, The Verge, Wired), policy research organizations (CDT, EFF, ITIF, Brookings, Future of Privacy Forum, Access Now), and platform transparency reports — never general web sources. Where approved sources didn't fully cover a topic, the briefing says so in its Research Note rather than filling the gap.
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
